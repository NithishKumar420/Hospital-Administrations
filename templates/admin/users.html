{% extends 'admin/adminpanel.html' %}

{% block content%}
<style>
     .button-container {
        display: flex;
        margin-bottom: 20px;
        justify-content: end;
        margin-top: 30px;
    }
    .addnew_btn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-left: 30px;
        margin-right: 130px;
    }
    /* Fix: button link color */
    .addnew_btn a {
        color: white;
        text-decoration: none;
    }
    table {
        width: 80%;
        border-collapse: collapse;
        margin: 30px auto;
    }
    th, td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
    }
    th {
        background-color: #1e1e2f;
        color: white;
    }
    tr:nth-child(even) {
        background-color: #f2f2f2;
    }
    tr:hover {
        background-color: #ddd;
    }
</style>

<div class="button-container">
    <button class="addnew_btn">
        <a href="{{ url_for('admin_new_users') }}">Add Users</a>
    </button>
</div>

<table>
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>  {# Fix: was staff.staff_id — wrong variable #}
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
            <a href="{{ url_for('admin.edit_user', user_id=user.id) }}">Edit</a> |
            <a href="{{ url_for('admin.delete_user', user_id=user.id) }}"
               onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
